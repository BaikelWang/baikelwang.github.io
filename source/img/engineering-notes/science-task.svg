<svg xmlns="http://www.w3.org/2000/svg" width="640" height="924" viewBox="0 0 640 924" role="img" aria-labelledby="title desc">
<title id="title">交付完整任务，而非一次调用</title><desc id="desc">校验输入：格式、单位、条件与适用范围；创建任务与排队：稳定标识、独立目录与状态；执行模型及外部程序：隔离依赖，传递超时与取消；检查结果与诊断：区分成功、失败和结果不确定；交付可追溯产物：输入、版本、参数、警告和文件。取消后需确认执行退出与资源回收。计算完成 ≠ 科学结论已经验证</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#314a57" stroke-width="1.4"/></marker></defs>
<rect width="640" height="924" fill="#f8f5ee"/>
<g font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" fill="#314a57">
<text x="40" y="48" font-family="Georgia,serif" font-size="17" letter-spacing="2">ENGINEERING NOTES</text>
<line x1="40" y1="66" x2="600" y2="66" stroke="#cbc5b9"/>
<text x="40" y="116" font-size="32" font-weight="600">交付完整任务，而非一次调用</text>
<text x="40" y="194" font-family="Georgia,serif" fill="#854942" font-size="25">01</text>
<rect x="88" y="150" width="512" height="96" rx="4" fill="#fffdf8" stroke="#cbc5b9" stroke-width="1.3"/>
<text x="112" y="187" font-size="28" font-weight="600">校验输入</text>
<text x="112" y="224" font-size="24" fill="#677279">格式、单位、条件与适用范围</text><path d="M344 248v24" stroke="#314a57" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="40" y="320" font-family="Georgia,serif" fill="#854942" font-size="25">02</text>
<rect x="88" y="276" width="512" height="96" rx="4" fill="#fffdf8" stroke="#cbc5b9" stroke-width="1.3"/>
<text x="112" y="313" font-size="28" font-weight="600">创建任务与排队</text>
<text x="112" y="350" font-size="24" fill="#677279">稳定标识、独立目录与状态</text><path d="M344 374v24" stroke="#314a57" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="40" y="446" font-family="Georgia,serif" fill="#854942" font-size="25">03</text>
<rect x="88" y="402" width="512" height="96" rx="4" fill="#fffdf8" stroke="#cbc5b9" stroke-width="1.3"/>
<text x="112" y="439" font-size="28" font-weight="600">执行模型及外部程序</text>
<text x="112" y="476" font-size="24" fill="#677279">隔离依赖，传递超时与取消</text><path d="M344 500v24" stroke="#314a57" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="40" y="572" font-family="Georgia,serif" fill="#854942" font-size="25">04</text>
<rect x="88" y="528" width="512" height="96" rx="4" fill="#fffdf8" stroke="#cbc5b9" stroke-width="1.3"/>
<text x="112" y="565" font-size="28" font-weight="600">检查结果与诊断</text>
<text x="112" y="602" font-size="24" fill="#677279">区分成功、失败和结果不确定</text><path d="M344 626v24" stroke="#314a57" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="40" y="698" font-family="Georgia,serif" fill="#854942" font-size="25">05</text>
<rect x="88" y="654" width="512" height="96" rx="4" fill="#fffdf8" stroke="#cbc5b9" stroke-width="1.3"/>
<text x="112" y="691" font-size="28" font-weight="600">交付可追溯产物</text>
<text x="112" y="728" font-size="24" fill="#677279">输入、版本、参数、警告和文件</text><line x1="40" y1="785" x2="600" y2="785" stroke="#cbc5b9"/><text x="40" y="825" font-size="24" fill="#854942">取消后需确认执行退出与资源回收</text><text x="40" y="859" font-size="24" fill="#677279">计算完成 ≠ 科学结论已经验证</text></g></svg>
